name: Validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  governance-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check governance bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f AGENTS.md
          test -f .github/CODEOWNERS
          test -f .github/pull_request_template.md
          grep -q "workspace-governance" README.md
          grep -q "platform-engineering" README.md
          grep -q "security-architecture" README.md
          grep -q "runtime implementation repo" AGENTS.md
      - name: Validate Python project scaffold
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -e ".[test]"
          python3 scripts/validate_project.py --repo-root .
      - name: Run Python tests
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="packages/control_fabric_core/src:apps/api/src:apps/cli/src"
          python3 -m unittest discover -s tests
          python3 -m wgcf_cli status --repo-root .

  runtime-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API and activity-worker targets
        run: |
          set -euo pipefail
          source_revision="$(git rev-parse HEAD)"
          docker build --target api --tag wgcf-api:ci .
          docker build \
            --build-arg WGCF_SOURCE_REVISION="${source_revision}" \
            --target worker \
            --tag wgcf-worker:ci \
            .

      - name: Smoke test API target
        run: |
          set -euo pipefail
          cid="$(docker run -d --rm -p 18090:8080 wgcf-api:ci)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18090/healthz | grep -q '"status":"ok"'; then
              curl --fail --silent http://127.0.0.1:18090/readyz | grep -q '"ready":true'
              exit 0
            fi
            sleep 1
          done

          docker logs "$cid"
          exit 1

      - name: Prove activity-worker source and default denial
        run: |
          set -euo pipefail
          docker run --rm wgcf-worker:ci | grep -q "status: activity-worker-source-ready"
          if docker run --rm wgcf-worker:ci wgcf-worker run; then
            echo "worker unexpectedly started without activation evidence" >&2
            exit 1
          fi
          docker run --rm wgcf-worker:ci \
            wgcf-worker controlled-proof status --repo-root /app \
            | grep -q "status: controlled-proof-activity-worker-source-ready"
          source_revision="$(git rev-parse HEAD)"
          docker run --rm \
            --env EXPECTED_SOURCE_REVISION="${source_revision}" \
            wgcf-worker:ci \
            sh -ec '
              test "$(id -u)" = "10001"
              test "$(cat /opt/wgcf/build/source-revision)" = "${EXPECTED_SOURCE_REVISION}"
              test "$(stat -c "%u:%a" /opt/wgcf/build/source-revision)" = "0:444"
              test -w /var/lib/wgcf/orchestration/controlled-proof
              test -w /var/lib/wgcf/orchestration/validation-readiness
            '
          if docker run --rm wgcf-worker:ci wgcf-worker controlled-proof run; then
            echo "controlled-proof worker unexpectedly started without a permit context" >&2
            exit 1
          fi
